<!DOCTYPE html>
<html lang="es-AR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada | K-mer Labs</title>
    <meta name="robots" content="noindex">
    <!-- GitHub Pages sirve esta página para cualquier ruta que no existe, desde
         cualquier profundidad: por eso todas las rutas son absolutas. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

    <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme');
                if (saved === 'dark' || saved === 'light') {
                    document.documentElement.setAttribute('data-theme', saved);
                }
            } catch (e) { /* localStorage bloqueado: queda la preferencia del sistema */ }
        }());
    </script>

    <link rel="stylesheet" href="/styles.css?v=18">
</head>

<body>
    <main class="section">
        <div class="wrap wrap--narrow">
            <img src="/img/logo.svg" width="72" height="72" alt="" style="margin-bottom:2rem">
            <p class="section__label">Error 404</p>
            <h1 class="section__title">Esta página no existe</h1>
            <p class="lead" style="margin-bottom:2rem">
                Puede que el enlace esté mal escrito o que la página se haya movido.
            </p>
            <div class="btn-row">
                <a class="btn btn--primary" href="/">Volver al inicio</a>
                <a class="btn btn--ghost" href="/#contacto">Contacto</a>
            </div>
        </div>
    </main>
</body>

</html>
